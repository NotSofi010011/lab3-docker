<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Docker Fullstack Demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
    input { padding: 10px; width: 300px; }
    button { padding: 10px 20px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { padding: 10px; background: #f0f0f0; margin: 5px 0; border-radius: 5px; }
    .status { padding: 10px; border-radius: 5px; margin-bottom: 20px; }
    .healthy { background: #d4edda; }
    .error { background: #f8d7da; }
  </style>
</head>
<body>
  <h1>Docker Fullstack Demo</h1>
  <div id="status" class="status">Checking...</div>
  <h2>Add Item</h2>
  <input type="text" id="itemName" placeholder="Enter item name">
  <button onclick="addItem()">Add</button>
  <h2>Items</h2>
  <ul id="items"></ul>
  <script>
    async function checkHealth() {
      try {
        const res = await fetch('/api/health');
        const data = await res.json();
        document.getElementById('status').textContent = 'API Status: ' + data.status;
        document.getElementById('status').className = 'status healthy';
      } catch (err) {
        document.getElementById('status').textContent = 'API Error: ' + err.message;
        document.getElementById('status').className = 'status error';
      }
    }
    async function loadItems() {
      try {
        const res = await fetch('/api/items');
        const items = await res.json();
        document.getElementById('items').innerHTML =
          items.map(i => '<li>' + i.name + '</li>').join('');
      } catch (err) {
        console.error(err);
      }
    }
    async function addItem() {
      const name = document.getElementById('itemName').value;
      if (!name) return;
      try {
        await fetch('/api/items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        document.getElementById('itemName').value = '';
        loadItems();
      } catch (err) {
        console.error(err);
      }
    }
    checkHealth();
    loadItems();
  </script>
</body>
</html>
